<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Exclusive Access</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-2: #273449;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5; min-height: 100vh;
    }
    main {
      max-width: 520px; margin: 0 auto; padding: 64px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      background: var(--bg); color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .actions { display: flex; gap: 8px; margin-top: 18px; }
    button {
      background: var(--accent); color: #0b1220;
      border: none; border-radius: 8px;
      padding: 10px 16px; font-weight: 600;
      cursor: pointer; font-size: 0.95rem;
    }
    button:hover { background: var(--accent-hover); }
    .msg { font-size: 0.88rem; margin-top: 12px; min-height: 1.2em; }
    .msg.error { color: var(--danger); }
    .status {
      color: var(--muted); font-size: 0.9rem;
      text-align: center; padding: 32px 0;
    }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <h1>Exclusive Access</h1>
    <p class="lead">Enter your access key to load the page.</p>

    <div class="panel" id="gate">
      <label for="key">Access key</label>
      <input type="password" id="key" autocomplete="off" autofocus />
      <div class="msg" id="msg"></div>
      <div class="actions">
        <button id="unlock-btn" type="button">Unlock</button>
      </div>
    </div>

    <div id="app" class="status" hidden>Loading…</div>
  </main>

  <script>
    (function () {
      var gate = document.getElementById("gate");
      var keyInput = document.getElementById("key");
      var msg = document.getElementById("msg");
      var unlockBtn = document.getElementById("unlock-btn");
      var app = document.getElementById("app");

      function pad32(bytes) {
        var out = new Uint8Array(32);
        out.set(bytes.subarray(0, 32));
        if (bytes.length < 32) out.fill(0x30, bytes.length); // '0'
        return out;
      }

      function hexOf(buf) {
        var arr = new Uint8Array(buf);
        var s = "";
        for (var i = 0; i < arr.length; i++) {
          s += arr[i].toString(16).padStart(2, "0");
        }
        return s;
      }

      function b64ToBytes(b64) {
        var bin = atob(b64);
        var out = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
        return out;
      }

      function showError(text) {
        msg.textContent = text;
        msg.className = "msg error";
      }

      function showApp(html) {
        gate.hidden = true;
        app.hidden = false;
        app.className = "";
        app.innerHTML = html;
      }

      function showAppError(text) {
        gate.hidden = true;
        app.hidden = false;
        app.className = "status error";
        app.textContent = text;
      }

      async function loadPage(secretKey) {
        try {
          var enc = new TextEncoder();
          var hashBuf = await crypto.subtle.digest("SHA-256", enc.encode(secretKey));
          var storageHash = hexOf(hashBuf);

          var resp = await fetch("./data/" + storageHash + ".json");
          if (!resp.ok) throw new Error("notfound");
          var payload = await resp.json();
          if (payload.alg !== "AES-256-GCM") throw new Error("alg");

          var keyBytes = pad32(enc.encode(secretKey));
          var key = await crypto.subtle.importKey(
            "raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]
          );

          var iv = b64ToBytes(payload.iv);
          var ct = b64ToBytes(payload.ct);
          var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
          var html = new TextDecoder().decode(plain);
          showApp(html);
        } catch (err) {
          showAppError("Access denied: invalid link or key.");
        }
      }

      function tryUnlock() {
        var key = keyInput.value;
        if (!key) { showError("Please enter a key."); return; }
        msg.textContent = "";
        msg.className = "msg";
        loadPage(key);
      }

      unlockBtn.addEventListener("click", tryUnlock);
      keyInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") tryUnlock();
      });

      // Direct entry: if URL already has a #SecretKey, try it.
      var hashKey = (location.hash || "").replace(/^#/, "");
      if (hashKey) {
        gate.hidden = true;
        app.hidden = false;
        loadPage(hashKey);
      }
    })();
  </script>
</body>
</html>
