<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0;
      --muted: #94a3b8; --accent: #38bdf8; --border: #334155;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    main {
      max-width: 520px; margin: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.3rem; }
    p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>This URL form is no longer supported. Please open the access page and enter your key.</p>
    <a href="./index.html">Go to access page</a>
  </main>
</body>
</html>
