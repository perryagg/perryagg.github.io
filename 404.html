<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redirecting…</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #f87171;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main {
    max-width: 520px;
    margin: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 1.3rem; }
  p { margin: 0; color: var(--muted); font-size: 0.95rem; }
  a { color: var(--accent); }
  code {
    display: inline-block;
    margin-top: 12px;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 0.85rem;
    word-break: break-all;
  }
  .error { color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1 id="title">Looking up page…</h1>
  <p id="msg">Resolving the hash from your URL.</p>
  <code id="path"></code>
</main>
<script>
  (function () {
    var titleEl = document.getElementById("title");
    var msgEl = document.getElementById("msg");
    var pathEl = document.getElementById("path");

    // Last non-empty path segment, e.g. "/678e82d.../" -> "678e82d..."
    var raw = location.pathname.replace(/\/+$/, "").split("/").pop() || "";
    pathEl.textContent = location.pathname;

    // GitHub Pages serves this 404.html "at" the requested URL, so relative
    // paths would resolve under /<hash>/. Use absolute paths everywhere.
    var base = location.origin + "/";

    // Bail out for "/" or "index.html" — should not happen, but be safe.
    if (!raw || raw === "index.html" || raw === "404.html") {
      window.location.replace(base + "index.html");
      return;
    }

    // Only 64-char hex (case-insensitive) is treated as a hash candidate.
    if (!/^[0-9a-f]{64}$/i.test(raw)) {
      titleEl.textContent = "Page not found";
      msgEl.className = "error";
      msgEl.innerHTML = 'That path is not a recognized hash. <a href="' + base + 'index.html">Back to all pages</a>.';
      return;
    }

    var target = raw.toLowerCase();

    fetch(base + "passwords.json")
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        var entries = (data && data.entries) || [];
        for (var i = 0; i < entries.length; i++) {
          if ((entries[i].hash || "").toLowerCase() === target) {
            window.location.replace(base + entries[i].page);
            return;
          }
        }
        titleEl.textContent = "Hash not recognized";
        msgEl.className = "error";
        msgEl.innerHTML = 'No page is registered for that hash. <a href="' + base + 'index.html">Back to all pages</a>.';
      })
      .catch(function () {
        titleEl.textContent = "Lookup failed";
        msgEl.className = "error";
        msgEl.innerHTML = 'Could not load <code>passwords.json</code>. <a href="' + base + 'index.html">Back to all pages</a>.';
      });
  })();
</script>
</body>
</html>
