<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page 28 — Protected Page</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0ea5e9;
    --danger: #f87171;
    --success: #4ade80;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); font-size: 0.92rem; }
  main { max-width: 520px; margin: 0 auto; padding: 32px 24px 64px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .panel h2 { margin: 0 0 6px; font-size: 1.1rem; }
  .panel .page-name { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1rem;
  }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button {
    background: var(--accent);
    color: #0b1220;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button.secondary:hover { color: var(--text); border-color: var(--text); }
  .msg { font-size: 0.88rem; margin-top: 10px; min-height: 1.2em; }
  .msg.error { color: var(--danger); }
  .msg.success { color: var(--success); }
  .reveal { display: none; margin-top: 18px; padding: 16px; background: var(--panel-2); border-radius: 10px; }
  .reveal.open { display: block; }
  .reveal h2 { margin: 0 0 8px; font-size: 1.1rem; }
  .reveal p { margin: 0; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px 16px 40px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Protected Page</h1>
  <p>Page 28 of 30</p>
</header>
<main>
  <div class="panel" id="gate">
    <h2>Enter password</h2>
    <div class="page-name">Page 28</div>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="off" autofocus />
    <div class="msg error" id="msg"></div>
    <div class="actions">
      <button id="back-btn" class="secondary" type="button">Back</button>
      <button id="unlock-btn" type="button">Unlock</button>
    </div>
  </div>

  <div class="reveal" id="reveal">
    <h2>Welcome to Page 28</h2>
    <p>You have unlocked this page.</p>
  </div>
</main>
<footer>
  <a href="index.html">Back to all pages</a>
</footer>
<script>
  (function () {
    var PASSWORD = "bramble-7528-harvest";
    var pw = document.getElementById("pw");
    var msg = document.getElementById("msg");
    var unlockBtn = document.getElementById("unlock-btn");
    var backBtn = document.getElementById("back-btn");
    var reveal = document.getElementById("reveal");
    var gate = document.getElementById("gate");

    function tryUnlock() {
      if (pw.value === PASSWORD) {
        msg.textContent = "";
        msg.className = "msg";
        gate.style.display = "none";
        reveal.classList.add("open");
      } else {
        msg.textContent = "Incorrect password. Please try again.";
        msg.className = "msg error";
        pw.select();
      }
    }

    unlockBtn.addEventListener("click", tryUnlock);
    backBtn.addEventListener("click", function () { window.location.href = "index.html"; });
    pw.addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryUnlock();
    });
  })();
</script>
</body>
</html>
